# Postgres for Eren, and optionally Eren itself.
#
#   docker compose up -d
#     Just Postgres. Run the server on your machine against it:
#       export DATABASE_URL=postgres://aichip:aichip@localhost:5433/aichip
#       cargo run -p eren-cli -- serve
#     This is the recommended shape — see README.md for why.
#
#   docker compose --profile app up -d --build
#     Everything, including the agents, inside containers. Needs
#     CLAUDE_CODE_OAUTH_TOKEN and EREN_PROJECTS_DIR in a .env file, because
#     a container has no keychain and no browser to log in with. Read the
#     "Running in Docker" section of README.md first.
#
#   ./scripts/docker-publish.sh   then, anywhere,   ./scripts/docker-deploy.sh
#     The same, from an image on Docker Hub (neiellcare71/eren unless
#     EREN_IMAGE says otherwise): build and push once, then run it on a
#     machine that has only this file, .env and the deploy script.
#
#   docker compose --profile storage up -d
#     Adds object storage for knowledge-base attachments. Optional, and in a
#     profile of its own so that nothing else waits on it: the knowledge base
#     works without it, and an image that cannot be pulled must not stop
#     Postgres or Eren from starting. Profiles combine:
#     `--profile app --profile storage`.
#
# Why some names here still say aichip, the project's old name: they name
# data that already exists. A Docker volume is found by its name, and the
# Postgres image creates its role and database only when the volume is new,
# so renaming either would leave an existing install looking at an empty
# volume, or at a role that does not exist. They are names, not branding,
# and nothing outside this file shows them.
#
# Your data is in the volumes at the bottom: `down` keeps them, `down -v`
# deletes them. scripts/docker-deploy.sh backs them up before every deploy
# — see "Keeping your data across redeploys" in README.md.
#
# Variables you set in `.env` are read as EREN_* first and AICHIP_* second,
# so an `.env` written before the rename keeps working.

services:
  postgres:
    image: postgres:17-alpine
    container_name: eren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aichip}
      POSTGRES_DB: ${POSTGRES_DB:-aichip}
    ports:
      # 5433 on the host so a local Postgres on 5432 keeps working.
      #
      # Every port here is published on 127.0.0.1 only. Docker's default is
      # every interface, which put this database — default password and all —
      # on the network of anyone who followed the one-line setup. Whoever can
      # write to it can register an MCP server or an attention hook, both of
      # which Eren runs as commands.
      - "0.0.0.0:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aichip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aichip} -d ${POSTGRES_DB:-aichip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for knowledge-base attachments — images and files pasted
  # into an article. Article text lives in Postgres; only the blobs come here.
  # The knowledge base works without this, you just can't attach files.
  #
  # RustFS, an S3-compatible server. This used to be MinIO, until MinIO
  # stopped publishing its image: `minio/minio` no longer exists on Docker
  # Hub, and a pull of it failed the whole `up`. Pinned rather than `latest`,
  # so the next upstream change is a decision, not a surprise. Eren speaks
  # plain S3 (path-style, SigV4), so any S3 server works here.
  storage:
    profiles: ["storage"]
    image: rustfs/rustfs:1.0.0
    container_name: eren-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${EREN_S3_ACCESS_KEY:-${AICHIP_S3_ACCESS_KEY:-aichip}}
      RUSTFS_SECRET_KEY: ${EREN_S3_SECRET_KEY:-${AICHIP_S3_SECRET_KEY:-aichip-dev-secret}}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      # 9100/9101 on the host, so an S3 server you already run on 9000 keeps
      # working. MINIO_* are the names these had before.
      - "0.0.0.0:${S3_PORT:-${MINIO_PORT:-9100}}:9000"
      - "0.0.0.0:${S3_CONSOLE_PORT:-${MINIO_CONSOLE_PORT:-9101}}:9001"
    volumes:
      # A new volume, not MinIO's `aichip-minio`: that holds MinIO's own
      # on-disk format. It is left exactly as it was — see README.md for
      # moving old attachments across.
      - eren-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://0.0.0.0:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The app profile needs CLAUDE_CODE_OAUTH_TOKEN and EREN_PROJECTS_DIR in
  # `.env`. They are defaulted rather than declared required, because Compose
  # interpolates every service whatever profile you asked for — a required
  # variable here made `docker compose --profile storage up -d` fail too. Without a real
  # token the container starts and reports "not logged in" on its first run.
  eren:
    profiles: ["app"]
    # Built here by `--build`, or pulled by scripts/docker-deploy.sh from the
    # registry scripts/docker-publish.sh pushed to (EREN_IMAGE, EREN_TAG).
    # Pulling needs neither the source nor the build context.
    image: ${EREN_IMAGE:-neiellcare71/eren}:${EREN_TAG:-latest}
    build:
      context: .
      args:
        # Files the agents write land in your mounted code, so they should
        # belong to you and not to root.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: eren
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aichip}:${POSTGRES_PASSWORD:-aichip}@postgres:5432/${POSTGRES_DB:-aichip}
      # The only way to authenticate without a keychain or a browser.
      # `claude setup-token` on your machine produces it. Failing loudly
      # beats starting a server whose every run dies logged-out.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Your code, at the same path inside and out — see the volume below.
      EREN_BROWSE_ROOT: ${EREN_PROJECTS_DIR:-${AICHIP_PROJECTS_DIR:-/workspace}}
      EREN_MAX_CONCURRENT: ${EREN_MAX_CONCURRENT:-${AICHIP_MAX_CONCURRENT:-2}}
      # Off by default here: the port below is published on the host's
      # loopback only, so the one browser that can reach it is yours, and it
      # arrives through Docker's gateway rather than from 127.0.0.1 — which
      # the token would otherwise ask to sign in. Publish the port wider and
      # leave this unset, and every other device needs Eren's access link.
      EREN_ACCESS_TOKEN: ${EREN_ACCESS_TOKEN:-off}
      EREN_ALLOWED_HOSTS: ${EREN_ALLOWED_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports:
      # Loopback on the host unless EREN_PUBLISH_IP says otherwise, whatever
      # the container binds inside. To reach it from other devices, set
      # EREN_PUBLISH_IP=0.0.0.0 and EREN_ALLOWED_HOSTS to the address you use,
      # and turn accounts on (`docker compose exec eren eren admin create
      # --username <name>`) so every browser signs in — without them, anyone
      # who can reach the port can drive it.
      - "${EREN_PUBLISH_IP:-0.0.0.0}:${EREN_PORT:-${AICHIP_PORT:-4820}}:4820"
    volumes:
      # Mounted at the *same absolute path* on both sides. A git worktree
      # records absolute paths in .git, so a repo checked out at one path on
      # the host and another in the container has a broken worktree link.
      - ${EREN_PROJECTS_DIR:-${AICHIP_PROJECTS_DIR:-/workspace}}:${EREN_PROJECTS_DIR:-${AICHIP_PROJECTS_DIR:-/workspace}}
      # Worktrees and agent state. A named volume, so a container restart
      # doesn't strand half-finished work. The image links the old home,
      # /home/aichip/.aichip, to this one, so paths stored before the rename
      # still resolve.
      - aichip-state:/home/eren/.eren
      # The Claude Code CLI's own folder: its session transcripts, which
      # every chat resumes by id. Without a volume they went with the
      # container, and every chat older than the last `up` failed with "No
      # conversation found". Eren never reads it; the CLI does. Your login is
      # not here — it is CLAUDE_CODE_OAUTH_TOKEN, in the environment.
      - eren-claude:/home/eren/.claude

volumes:
  aichip-pgdata:
  aichip-state:
  eren-objects:
  eren-claude:
